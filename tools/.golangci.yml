# golangci-lint v2 config. govet, errcheck, staticcheck, ineffassign and
# unused are on by default in v2, so only revive needs to be added explicitly;
# gofmt lives under `formatters`. The `exclusions` presets below were
# auto-generated by `golangci-lint migrate` (v1 -> v2), not hand-picked
# suppressions.
version: "2"
linters:
  enable:
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
